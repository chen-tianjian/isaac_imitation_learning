services:
  isaac_imitation_learning:
    image: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
    shm_size: 2gb
    entrypoint: ["/workspace/docker/init.sh"]
    command: ["bash"]
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ~/clearml.conf:/root/clearml.conf:ro
      - ~/.clearml:/root/.clearml
      - ~/.cache/torch:/root/.cache/torch
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all  # graphics + compute for Isaac Sim GUI
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    stdin_open: true
    tty: true
